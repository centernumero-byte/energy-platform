<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Platform — Телесные и энергетические практики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<meta name="theme-color" content="#19224a">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at 70% 15%, rgba(72, 110, 200, 0.22), transparent 28%),
    radial-gradient(circle at 20% 80%, rgba(60, 90, 170, 0.18), transparent 30%),
    linear-gradient(135deg, #0f1530 0%, #19224a 45%, #0f1530 100%);
  color: #f8e7a8;
  font-family: Arial, sans-serif;
  visibility: hidden;
}

/* ===================== ПЛАТФОРМА ===================== */

.platform {
  min-height: 100vh;
  display: flex;
  padding: 8px;
}

/* Левое меню */

.sidebar {
  width: 245px;
  min-height: calc(100vh - 16px);
  padding: 28px 18px 24px;
  border: 1px solid rgba(220, 169, 42, 0.65);
  border-radius: 18px 0 0 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(80, 115, 205, 0.30), transparent 28%),
    linear-gradient(180deg, #1b2448 0%, #111833 100%);
  display: flex;
  flex-direction: column;
}

.logo { text-align: center; margin-bottom: 38px; }

.logo-symbol {
  width: 100px; height: 100px; margin: 0 auto 14px;
  border-radius: 50%; border: 2px solid #e7bd43;
  display: flex; align-items: center; justify-content: center;
  color: #f5d46b; font-size: 48px;
  box-shadow: 0 0 20px rgba(225, 184, 64, 0.35), inset 0 0 20px rgba(225, 184, 64, 0.12);
}

.logo-title { font-family: PT Serif, Georgia, serif; font-size: 25px; color: #f5d46b; letter-spacing: 1px; }
.logo-subtitle { margin-top: 8px; font-size: 20px; color: #e7bd43; }

.nav { display: flex; flex-direction: column; gap: 12px; }

.nav-item {
  width: 100%; min-height: 52px; padding: 15px 16px;
  border-radius: 12px; border: 1px solid transparent;
  background: transparent; color: #f5f0df;
  font-size: 18px; line-height: 1.2; text-align: left; cursor: pointer;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
  display: flex; align-items: center;
}
.nav-item:hover { background: rgba(80, 110, 190, 0.25); border-color: rgba(218, 173, 49, 0.55); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(60, 95, 180, 0.55), rgba(45, 75, 150, 0.35));
  border-color: #d7aa31; color: #f8d96d;
  box-shadow: 0 0 15px rgba(212, 164, 43, 0.12);
}
.nav-icon {
  display: inline-flex; width: 32px; min-width: 32px; margin-right: 2px;
  align-items: center; justify-content: center; color: #f2c84d; font-size: 22px;
}
.logout { margin-top: auto; color: #f5d46b; }

/* Основная область */

.main {
  flex: 1; min-height: calc(100vh - 16px);
  padding: 42px 30px 36px;
  border: 1px solid rgba(220, 169, 42, 0.65); border-left: none;
  border-radius: 0 18px 18px 0;
  background:
    radial-gradient(circle at 55% 5%, rgba(80, 120, 210, 0.23), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(60, 90, 170, 0.16), transparent 30%),
    #1a2347;
}

.top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
.welcome h1 { margin: 0; font-family: PT Serif, Georgia, serif; font-size: 43px; font-weight: 500; color: #f8dc78; }
.account { display: flex; align-items: center; gap: 12px; color: #f4e9cc; font-size: 16px; }
.account-icon {
  width: 45px; height: 45px; border: 1px solid #e3b936; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #f4c94f; font-size: 23px;
}

/* Карточки направлений */

.cards {
  display: grid;
  grid-template-columns: repeat(5, 180px);
  gap: 20px;
  justify-content: start;
  align-items: start;
  width: 100%;
  margin-top: 18px;
}

.cards .card, .method-card {
  width: 180px; height: 250px; min-height: 250px; box-sizing: border-box;
  padding: 18px 14px; border: 1px solid rgba(225, 180, 52, 0.9); border-radius: 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(80, 115, 200, 0.30), transparent 40%),
    linear-gradient(145deg, #263463 0%, #1a2449 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), inset 0 0 30px rgba(80, 110, 190, 0.08);
  transition: transform 0.25s, box-shadow 0.25s;
}
.cards .card:hover, .method-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25), 0 0 22px rgba(222, 174, 47, 0.12);
}
.method-card:not([onclick]) { cursor: default; }

.cards .card-icon {
  height: 65px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 52px; line-height: 1; color: #f2c94c;
  text-shadow: 0 0 20px rgba(239, 192, 62, 0.3);
}
.cards .card-content h3 { margin: 0 0 9px; font-family: PT Serif, Georgia, serif; font-size: 20px; line-height: 1.12; font-weight: 500; color: #f6d66c; }
.cards .card-content p { margin: 0; font-size: 14px; line-height: 1.3; color: #eee5d0; }

.card.has-material { border-color: #8fe3a1; }

.pythagoras-icon {
  display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 3px 8px;
  width: 88px; height: 65px !important; font-size: 17px !important; line-height: 1 !important;
}
.pythagoras-icon span { display: flex; align-items: center; justify-content: center; }

.library-icon { font-size: 54px !important; line-height: 1; height: 65px !important; display: flex; align-items: center; justify-content: center; }

.section-title { width: 100%; margin: 0 0 20px; }
.section-title h2 { margin: 0; font-family: PT Serif, Georgia, serif; font-size: 31px; font-weight: 500; color: #f6d66c; }

.back-link {
  display: inline-flex; align-items: center; gap: 8px;
  color: #f6d66c; background: none; border: none; cursor: pointer;
  font-size: 16px; margin-bottom: 14px; padding: 0;
}

/* Дашборд-блоки (доступы / статистика / мои расчёты) */

.dashboard-wrap { width: 100%; }
.dashboard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
.dashboard-head h2 { margin: 0 0 8px; font-family: PT Serif, Georgia, serif; font-size: 31px; color: #f6d66c; }
.dashboard-head p { margin: 0; color: #eee5d0; font-size: 16px; }
.dashboard-badge {
  border: 1px solid rgba(225,180,52,.75); border-radius: 999px; padding: 8px 14px;
  color: #f6d66c; background: rgba(255,255,255,.05); white-space: nowrap;
}

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card, .table-card {
  border: 1px solid rgba(225,180,52,.65); border-radius: 16px;
  background: linear-gradient(145deg, rgba(38,52,99,.92), rgba(26,36,73,.92));
  box-shadow: inset 0 0 25px rgba(80,110,190,.08);
}
.stat-card { padding: 18px; overflow: hidden; }
.stat-card span { display: block; color: #eee5d0; font-size: 14px; margin-bottom: 8px; min-height: 34px; overflow-wrap: break-word; }
.stat-card strong { display: block; color: #f6d66c; font-family: PT Serif, Georgia, serif; font-size: 30px; }
.table-card { padding: 18px; overflow-x: auto; }
.table-title { color: #f6d66c; font-family: PT Serif, Georgia, serif; font-size: 22px; margin-bottom: 14px; }
.data-table { width: 100%; border-collapse: collapse; color: #eee5d0; }
.data-table th, .data-table td { padding: 12px 10px; border-bottom: 1px solid rgba(225,180,52,.18); text-align: left; }
.data-table th { color: #f6d66c; font-weight: 600; }
.empty-table { padding: 28px 10px; color: #d9d0bd; text-align: center; }

.access-locked { width: 100%; text-align: center; padding: 55px 30px; }
.access-locked-icon { font-size: 55px; margin-bottom: 15px; }
.access-locked h2 { font-family: PT Serif, Georgia, serif; font-size: 27px; color: #f6d66c; margin-bottom: 12px; }
.access-locked p { font-size: 17px; color: #eee5d0; line-height: 1.6; max-width: 650px; margin: 0 auto; }

/* ===================== СПИСОК МАТЕРИАЛОВ (полноценная страница) ===================== */

.materials-page { width: 100%; }

.materials-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap; gap: 14px;
}
.materials-head h2 { margin: 0; font-family: PT Serif, Georgia, serif; font-size: 27px; color: #f6d66c; }

.materials-add-btn {
  padding: 12px 20px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3d5fae, #2c4a8f);
  color: #f8d96d; cursor: pointer; font-size: 15px;
}

.materials-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.materials-tab {
  padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(225,180,52,.4);
  background: rgba(255,255,255,.03); color: #eee5d0; cursor: pointer; font-size: 14px;
}
.materials-tab.active { background: rgba(60,95,180,.55); border-color: #d7aa31; color: #f8d96d; }

.material-row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px; border-radius: 14px; margin-bottom: 12px;
  border: 1px solid rgba(225,180,52,.35);
  background: linear-gradient(145deg, rgba(38,52,99,.75), rgba(26,36,73,.75));
}
.material-row-icon {
  width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  background: rgba(255,255,255,.06); color: #f2c94c;
}
.material-row-body { flex: 1; min-width: 0; }
.material-row-title { color: #f8e7a8; font-size: 16px; margin-bottom: 4px; }
.material-row-meta { color: #b8ad98; font-size: 13px; overflow-wrap: anywhere; word-break: break-word; }
.material-row-open {
  padding: 10px 18px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3d5fae, #2c4a8f); color: #f8d96d;
  cursor: pointer; font-size: 14px; white-space: nowrap; text-decoration: none;
}
.materials-note { color: #b8ad98; font-size: 13px; margin-top: 10px; }

/* ===================== ОКНО ДОБАВЛЕНИЯ МАТЕРИАЛА ===================== */

.material-manager-overlay {
  position: fixed; inset: 0; z-index: 99999; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0, 0, 0, 0.72);
}
.material-manager {
  width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 30px;
  border-radius: 20px; background: linear-gradient(145deg, #263463, #1a2449);
  border: 1px solid #d7aa31; color: #f8e7a8; box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
}
.material-manager h2 { margin: 0 35px 24px 0; color: #f6d66c; font-family: PT Serif, Georgia, serif; }
.material-manager-close { float: right; background: none; border: none; color: #f6d66c; font-size: 30px; line-height: 1; cursor: pointer; }
.material-manager-label { display: block; margin: 16px 0 8px; color: #eee5d0; }
.material-manager-input {
  width: 100%; box-sizing: border-box; padding: 13px; margin-bottom: 12px;
  border-radius: 10px; border: 1px solid rgba(225, 180, 52, 0.5);
  background: rgba(0,0,0,.2); color: #fff; outline: none; font-size: 16px;
}
.material-manager-input::placeholder { color: #aaa1b4; }
.material-manager-button {
  width: 100%; margin-top: 4px; padding: 13px 16px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3d5fae, #2c4a8f); color: #f8d96d; cursor: pointer; font-size: 16px;
}
.material-manager-button:disabled { opacity: .55; cursor: wait; }
.material-manager-or { margin: 18px 0 4px; text-align: center; color: #c8bca4; }
.material-manager-status { margin-top: 18px; line-height: 1.45; }
.material-manager-status.ok { color: #a9e4b4; }
.material-manager-status.error { color: #ffb0b0; }
.material-manager-hint { margin-top: 8px; color: #bdb3c5; font-size: 13px; line-height: 1.4; }

/* ===================== АВТОРИЗАЦИЯ ===================== */

.auth-shell {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px;
  background:
    radial-gradient(circle at 50% 20%, rgba(72, 110, 200, 0.22), transparent 30%),
    linear-gradient(135deg, #0f1530, #19224a, #0f1530);
}
.auth-card {
  width: 420px; max-width: 100%; padding: 38px;
  border: 1px solid rgba(225, 180, 52, 0.7); border-radius: 20px;
  background: linear-gradient(145deg, #263463, #1a2449);
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4); text-align: center;
}
.auth-card-register { width: 600px; }
.auth-symbol { font-size: 48px; color: #f5d46b; margin-bottom: 8px; }
.auth-title { font-family: PT Serif, Georgia, serif; font-size: 28px; color: #f5d46b; }
.auth-subtitle { color: #e7bd43; margin-top: 5px; margin-bottom: 25px; }
.auth-card h2 { color: #f6d66c; font-family: PT Serif, Georgia, serif; font-weight: 500; }
.auth-card input {
  width: 100%; padding: 14px; margin: 7px 0; border: 1px solid rgba(225, 180, 52, 0.4);
  border-radius: 10px; background: rgba(0, 0, 0, 0.18); color: #fff; font-size: 16px; outline: none;
}
.auth-card button {
  width: 100%; padding: 14px; margin-top: 12px; border: 1px solid #d7aa31; border-radius: 10px;
  background: linear-gradient(90deg, #3d5fae, #2c4a8f); color: #f8d96d; font-size: 16px; cursor: pointer;
}
.auth-link { background: transparent !important; border: none !important; color: #d9cba8 !important; }
.auth-divider { margin: 15px 0; color: #a99d83; }
.auth-register { background: transparent !important; }
.auth-description { color: #ddd4c1; line-height: 1.5; }
.auth-message { margin-top: 14px; min-height: 22px; line-height: 1.4; }
.auth-message.error { color: #ff9b9b; }
.auth-message.success { color: #a8e6b0; }
.auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }

/* ===================== АДАПТАЦИЯ ===================== */

@media (max-width: 1200px) {
  .sidebar { width: 210px; }
  .cards { grid-template-columns: repeat(3, 180px); }
}
@media (max-width: 900px) {
}
@media (max-width: 800px) {
  .platform { display: block; }
  .sidebar { width: 100%; min-height: auto; border-radius: 18px 18px 0 0; }
  .main { border-left: 1px solid rgba(220, 169, 42, 0.65); border-top: none; border-radius: 0 0 18px 18px; }
  .cards { grid-template-columns: repeat(2, 180px); }
  .top { display: block; }
  .account { margin-top: 20px; }
  .auth-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .main { padding: 28px 15px 25px; }
  .welcome h1 { font-size: 31px; }
  .cards { grid-template-columns: 1fr; justify-items: center; }
  .cards .card, .method-card { width: 100%; max-width: 320px; }
  .material-row { flex-wrap: wrap; }
  .material-row-body { flex-basis: 100%; order: 1; }
  .material-row-icon { order: 0; }
  .material-row-open { order: 2; margin-left: 0 !important; }
  .data-table { font-size: 12px; width: max-content; min-width: 100%; }
  .data-table th, .data-table td { padding: 8px 9px; white-space: nowrap; }
  .data-table td a { white-space: nowrap; }
  .table-card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .dashboard-head { flex-direction: column; align-items: flex-start; gap: 10px; }
}

/* ===================== ЭНЕРГОПЛАТФОРМА: ДОПОЛНЕНИЯ ===================== */
.sidebar { overflow-y: auto; }
.nav { gap: 6px; }
.nav-item { min-height: 44px; padding: 10px 14px; font-size: 16px; }
.nav-sep { height: 1px; margin: 8px 6px; background: rgba(225,180,52,.25); }

.quick-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.quick-title { font-family: PT Serif, Georgia, serif; font-size: 22px; color: #f6d66c; margin: 34px 0 6px; }
.quick-chip {
  padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(225,180,52,.6);
  background: rgba(255,255,255,.04); color: #f8e7a8; cursor: pointer; font-size: 14px;
}
.quick-chip:hover { background: rgba(80,110,190,.3); }

.practice-meta { color: #b8ad98; font-size: 13px; }
.practice-head h2 { margin: 0 0 6px; font-family: PT Serif, Georgia, serif; font-size: 30px; color: #f6d66c; font-weight: 500; }
.practice-box {
  max-width: 780px; padding: 24px; margin-bottom: 18px; border-radius: 16px;
  border: 1px solid rgba(225,180,52,.45);
  background: linear-gradient(145deg, rgba(38,52,99,.75), rgba(26,36,73,.75));
  color: #eee5d0; line-height: 1.6; font-size: 16px;
}
.practice-box h3 { margin: 0 0 10px; color: #f6d66c; font-family: PT Serif, Georgia, serif; font-weight: 500; font-size: 20px; }
.practice-box ol, .practice-box ul { margin: 0; padding-left: 22px; }
.practice-box li { margin-bottom: 8px; }
.step-time { color: #b8ad98; font-size: 13px; white-space: nowrap; }
.safety-box { border-color: rgba(255,155,155,.55); }
.safety-box h3 { color: #ffb0b0; }
.gold-btn {
  padding: 13px 22px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #3d5fae, #2c4a8f); color: #f8d96d; cursor: pointer; font-size: 16px;
}
.gold-btn.ghost { background: rgba(255,255,255,.04); }
.gold-btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Плеер практики */
.player { max-width: 780px; text-align: center; padding: 30px 24px; }
.player-progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 18px; }
.player-progress div { height: 100%; background: linear-gradient(90deg, #d7aa31, #f6d66c); transition: width .3s; }
.player-stepno { color: #b8ad98; font-size: 14px; margin-bottom: 14px; }
.player-text { font-family: PT Serif, Georgia, serif; font-size: 24px; line-height: 1.45; color: #f8e7a8; min-height: 140px; }
.player-timer { font-size: 54px; color: #f6d66c; font-family: PT Serif, Georgia, serif; margin: 18px 0; letter-spacing: 2px; }
.player-controls { justify-content: center; margin-top: 10px; }
.player-opts { margin-top: 18px; color: #d9d0bd; font-size: 14px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.player-opts label { cursor: pointer; }

/* Шкала 1–10 */
.scale-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
.scale-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(225,180,52,.5);
  background: rgba(255,255,255,.04); color: #f8e7a8; cursor: pointer; font-size: 15px;
}
.scale-btn.active { background: #d7aa31; color: #10162c; }
textarea.material-manager-input { min-height: 90px; resize: vertical; font-family: Arial, sans-serif; }

/* Программы */
.days-grid { display: grid; grid-template-columns: repeat(7, minmax(84px, 1fr)); gap: 10px; max-width: 900px; }
.day-cell {
  padding: 12px 8px; border-radius: 12px; border: 1px solid rgba(225,180,52,.4);
  background: rgba(255,255,255,.03); color: #eee5d0; cursor: pointer; text-align: center; font-size: 13px; line-height: 1.3;
}
.day-cell b { display: block; font-size: 18px; color: #f6d66c; font-family: PT Serif, Georgia, serif; margin-bottom: 4px; }
.day-cell.done { border-color: #8fe3a1; background: rgba(143,227,161,.12); }
.day-cell.done b::after { content: " ✓"; color: #8fe3a1; }
.day-cell:hover { background: rgba(80,110,190,.25); }

/* Доступы */
.scope-table td, .scope-table th { text-align: center; }
.scope-table td:first-child, .scope-table th:first-child { text-align: left; }
.scope-table input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
.small-input { padding: 8px 10px !important; width: auto !important; margin: 0 !important; font-size: 14px !important; }
.status-ok { color: #8fe3a1; }
.status-off { color: #ff9d9d; }
.code-pill { display: inline-block; padding: 6px 12px; border-radius: 8px; border: 1px dashed #d7aa31; color: #f6d66c; font-size: 18px; letter-spacing: 2px; }

.landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px;
  background: radial-gradient(circle at 50% 20%, rgba(72,110,200,.22), transparent 30%), linear-gradient(135deg, #0f1530, #19224a, #0f1530); }
.landing-card { max-width: 860px; text-align: center; color: #eee5d0; }
.landing-card h1 { font-family: PT Serif, Georgia, serif; font-weight: 500; font-size: 44px; color: #f6d66c; margin: 10px 0 14px; }
.landing-card p { font-size: 18px; line-height: 1.6; }
.landing-dirs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 26px 0 30px; }

<script>
/* ============================================================
   ENERGY PLATFORM — основной код
   Аккаунты и профили общие с Numerology Platform (тот же Supabase).
   Доступы, библиотека, дневник, программы — таблицы energy_*.
   ============================================================ */

const SUPABASE_URL = "https://skvprhqsxnlacshucncq.supabase.co";
const SUPABASE_KEY = "sb_publishable_N0pKMmzNOonoInimmkding_GJnMwsRd";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_EMAILS = ["centernumero@gmail.com"];

const DIRS = window.ENERGY_DIRECTIONS;
const DIR_KEYS = DIRS.map(d => d.key);
const DIR_NAME = Object.fromEntries(DIRS.map(d => [d.key, d.title.replace(/&shy;/g, "").replace(/<br>/g, " ").replace(/\s+/g, " ")]));
const PRACTICES = window.ENERGY_PRACTICES;
const PRACTICE = Object.fromEntries(PRACTICES.map(p => [p.id, p]));
const PROGRAMS = window.ENERGY_PROGRAMS;
const PROGRAM = Object.fromEntries(PROGRAMS.map(p => [p.id, p]));

const ME = { user: null, profile: null, isAdmin: false, isPractitioner: false, member: null, grant: {}, period: null };

/* ---------- утилиты ---------- */
function esc(v) {
  return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function $(id) { return document.getElementById(id); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString("ru-RU") : "—"; }
function fmtMin(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function content() { return $("content"); }
function setActive(section) {
  document.querySelectorAll(".nav-item[data-section]").forEach(b => b.classList.toggle("active", b.dataset.section === section));
}
function showWelcome(show) { const el = $("welcomeTop"); if (el) el.style.display = show ? "" : "none"; }
function alertBox(message) {
  const o = document.createElement("div");
  o.className = "material-manager-overlay";
  o.innerHTML = `<div class="material-manager" style="width:440px;text-align:center;">
      <p style="font-size:17px;line-height:1.5;margin:0 0 20px;">${esc(message)}</p>
      <button class="material-manager-button" onclick="this.closest('.material-manager-overlay').remove()">Понятно</button></div>`;
  document.body.appendChild(o);
}
function confirmBox(message) {
  return new Promise(resolve => {
    const o = document.createElement("div");
    o.className = "material-manager-overlay";
    o.innerHTML = `<div class="material-manager" style="width:440px;text-align:center;">
        <p style="font-size:17px;line-height:1.5;margin:0 0 20px;">${esc(message)}</p>
        <div class="btn-row" style="justify-content:center;">
          <button class="gold-btn" data-v="1">Да</button><button class="gold-btn ghost" data-v="0">Отмена</button></div></div>`;
    o.querySelectorAll("button").forEach(b => b.onclick = () => { o.remove(); resolve(b.dataset.v === "1"); });
    document.body.appendChild(o);
  });
}

/* ---------- доступы ---------- */
function itemActive(item) {
  if (!item || !item.granted) return false;
  if (item.unlimited || !item.ends_at) return true;
  return new Date(item.ends_at) >= new Date();
}
function periodActive(p) {
  if (!p || p.status !== "active") return false;
  if (p.is_unlimited || !p.ends_at) return true;
  return new Date(p.ends_at) >= new Date();
}
// type: practices ; для journal/library — без направления
function can(type, dir) {
  if (ME.isAdmin) return true;
  if (type === "journal" || type === "library") return itemActive(ME.grant[type]);
  if (!dir) return false;
  return itemActive((ME.grant[dir] || {})[type]);
}
function canAnyDir(type) { return ME.isAdmin || DIR_KEYS.some(k => can(type, k)); }

function lockedHtml(title, text) {
  return `<div class="dashboard-wrap">
    <div class="dashboard-head"><div><h2>${esc(title)}</h2><p>Раздел доступен после выдачи доступа.</p></div>
    <div class="dashboard-badge">Доступ закрыт</div></div>
    <div class="access-locked"><div class="access-locked-icon">🔒</div>
      <h2>У вас нет доступа к этому разделу</h2>
      <p>${esc(text || "Чтобы открыть раздел, администратор или ваш практик должен выдать вам доступ.")}</p>
      <button class="material-manager-button" style="width:auto;margin-top:24px;" onclick="showSection('access')">Посмотреть статус доступа</button>
    </div></div>`;
}

/* ============================================================
   МАРШРУТИЗАЦИЯ
   ============================================================ */
function showSection(section) {
  stopPlayer();
  setActive(section);
  showWelcome(section === "home");
  window.scrollTo(0, 0);
  if (section === "home") return renderHome();
  if (section === "programs") return renderPrograms();
  if (DIR_KEYS.includes(section)) return renderDirection(section);
  if (section === "journal") return renderJournal();
  if (section === "library") return renderLibrary();
  if (section === "access") return renderAccess();
}

/* ---------- Главная: направления + срочная помощь ---------- */
function renderHome() {
  const cards = DIRS.map(d => `
    <div class="card method-card" onclick="showSection('${d.key}')" role="button" tabindex="0">
      <div class="card-icon">${d.icon}</div>
      <div class="card-content"><h3>${d.title}</h3><p>${esc(d.sub)}</p></div>
    </div>`).join("");
  const quick = window.ENERGY_QUICK.filter(id => PRACTICE[id]).map(id =>
    `<button class="quick-chip" onclick="openPractice('${id}')">${esc(PRACTICE[id].title)} · ${PRACTICE[id].min} мин</button>`).join("");
  content().innerHTML = `
    <div class="cards">${cards}</div>
    <div class="quick-title">Срочная помощь — 5 минут</div>
    <div class="materials-note" style="margin-top:0;">Короткие практики, когда нужно быстро успокоиться, очиститься после тяжёлой встречи или собраться. Открываются вместе с доступом к разделу.</div>
    <div class="quick-row" style="margin-top:14px;">${quick}</div>`;
}

/* ---------- Раздел (список практик) ---------- */
function renderDirection(dir) {
  if (dir === "programs") return renderPrograms();
  if (!can("practices", dir)) { content().innerHTML = lockedHtml(DIR_NAME[dir]); return; }
  const d = DIRS.find(x => x.key === dir);
  const list = PRACTICES.filter(p => p.dir === dir);
  content().innerHTML = `
    <div class="materials-page">
      <div class="materials-head"><h2>${d.icon} ${esc(DIR_NAME[dir])}</h2></div>
      ${dir === "secret_room" ? `<div class="materials-note" style="margin:-6px 0 16px;font-size:15px;">Проходите практики по порядку: сначала создайте комнату, затем возвращайтесь в неё для очищения, встречи с наставником и решения ситуаций.</div>` : ""}
      ${list.map(p => `
        <div class="material-row">
          <div class="material-row-icon">${d.icon}</div>
          <div class="material-row-body">
            <div class="material-row-title">${esc(p.title)}</div>
            <div class="material-row-meta">${p.min} мин · ${esc(p.source)}</div>
          </div>
          <button class="material-row-open" onclick="openPractice('${p.id}')">Открыть</button>
        </div>`).join("")}
    </div>`;
}

/* ---------- Карточка практики ---------- */
function stepsTotal(p) { return p.steps.reduce((a, s) => a + (s.s || 0), 0); }

function openPractice(id, fromProgram) {
  const p = PRACTICE[id];
  if (!p) return;
  if (!fromProgram && !can("practices", p.dir)) { showWelcome(false); content().innerHTML = lockedHtml(p.title); return; }
  stopPlayer();
  showWelcome(false);
  window.scrollTo(0, 0);
  const back = fromProgram ? `openProgram('${fromProgram}')` : `showSection('${p.dir}')`;
  content().innerHTML = `
    <button class="back-link" onclick="${back}">← Назад</button>
    <div class="practice-head"><h2>${esc(p.title)}</h2>
      <div class="practice-meta">${p.min} мин · Источник: ${esc(p.source)}</div></div>
    <div class="practice-box" style="margin-top:18px;">${esc(p.intro)}</div>
    ${p.need && p.need.length ? `<div class="practice-box"><h3>Что понадобится</h3><ul>${p.need.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
    <div class="practice-box"><h3>Шаги</h3><ol>${p.steps.map(s => `<li>${esc(s.t)} ${s.s ? `<span class="step-time">· ${fmtMin(s.s)}</span>` : ""}</li>`).join("")}</ol>
      ${p.after ? `<p style="margin:14px 0 0;color:#d9d0bd;"><b style="color:#f6d66c;">После практики:</b> ${esc(p.after)}</p>` : ""}</div>
    ${p.safety ? `<div class="practice-box safety-box"><h3>Безопасность</h3>${esc(p.safety)}</div>` : ""}
    <div class="btn-row">
      <button class="gold-btn" onclick="startPlayer('${p.id}', ${fromProgram ? `'${fromProgram}'` : "null"})">▶ Начать практику с ведением</button>
      <button class="gold-btn ghost" onclick="openJournalForm('${p.id}', ${fromProgram ? `'${fromProgram}'` : "null"})">✎ Записать в дневник</button>
    </div>`;
}

/* ============================================================
   ПЛЕЕР ПРАКТИКИ: шаги по одному, таймер, колокольчик, озвучка
   ============================================================ */
const PL = { p: null, i: 0, left: 0, timer: null, paused: false, voice: false, bell: true, program: null };

function bell() {
  if (!PL.bell) return;
  try {
    const ctx = PL.ctx || (PL.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const now = ctx.currentTime;
    [528, 792].forEach((f, k) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(k ? 0.08 : 0.18, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
      o.connect(g).connect(ctx.destination); o.start(now); o.stop(now + 2.7);
    });
  } catch (e) { /* звук недоступен */ }
}
function speak(text) {
  if (!PL.voice || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU"; u.rate = 0.9;
    const ru = speechSynthesis.getVoices().find(v => /ru/i.test(v.lang));
    if (ru) u.voice = ru;
    speechSynthesis.speak(u);
  } catch (e) { /* озвучка недоступна */ }
}
function stopPlayer() {
  clearInterval(PL.timer); PL.timer = null;
  try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
}
function startPlayer(id, program) {
  PL.p = PRACTICE[id]; PL.i = 0; PL.program = program || null; PL.paused = false;
  showWelcome(false);
  renderPlayerShell();
  playStep();
}
function renderPlayerShell() {
  const p = PL.p;
  content().innerHTML = `
    <button class="back-link" onclick="stopPlayer();openPractice('${p.id}', ${PL.program ? `'${PL.program}'` : "null"})">← Выйти из практики</button>
    <div class="practice-box player">
      <div class="player-progress"><div id="plBar" style="width:0%"></div></div>
      <div class="player-stepno" id="plNo"></div>
      <div class="player-text" id="plText"></div>
      <div class="player-timer" id="plTimer"></div>
      <div class="btn-row player-controls">
        <button class="gold-btn ghost" id="plPrev" onclick="prevStep()">← Назад</button>
        <button class="gold-btn ghost" id="plPause" onclick="togglePause()">⏸ Пауза</button>
        <button class="gold-btn" id="plNext" onclick="nextStep()">Дальше →</button>
      </div>
      <div class="player-opts">
        <label><input type="checkbox" id="plBell" ${PL.bell ? "checked" : ""} onchange="PL.bell=this.checked"> Колокольчик между шагами</label>
        <label><input type="checkbox" id="plVoice" ${PL.voice ? "checked" : ""} onchange="PL.voice=this.checked; if(PL.voice) speak(PL.p.steps[PL.i].t)"> Озвучивать шаги</label>
      </div>
    </div>`;
}
function playStep() {
  clearInterval(PL.timer);
  const p = PL.p, s = p.steps[PL.i];
  $("plNo").textContent = `Шаг ${PL.i + 1} из ${p.steps.length}`;
  $("plText").textContent = s.t;
  $("plBar").style.width = Math.round((PL.i) / p.steps.length * 100) + "%";
  $("plPrev").disabled = PL.i === 0;
  $("plNext").textContent = PL.i === p.steps.length - 1 ? "Завершить ✓" : "Дальше →";
  PL.left = s.s || 0;
  PL.paused = false; $("plPause").textContent = "⏸ Пауза";
  $("plPause").style.display = PL.left ? "" : "none";
  $("plTimer").textContent = PL.left ? fmtMin(PL.left) : "в своём темпе";
  $("plTimer").style.fontSize = PL.left ? "" : "18px";
  speak(s.t);
  if (!PL.left) return;
  PL.timer = setInterval(() => {
    if (PL.paused) return;
    PL.left--;
    $("plTimer").textContent = fmtMin(Math.max(0, PL.left));
    if (PL.left <= 0) { clearInterval(PL.timer); bell(); setTimeout(() => { if (PL.p === p) nextStep(); }, 1500); }
  }, 1000);
}
function nextStep() {
  if (!PL.p) return;
  if (PL.i < PL.p.steps.length - 1) { PL.i++; playStep(); return; }
  stopPlayer(); bell();
  finishPractice();
}
function prevStep() { if (PL.i > 0) { PL.i--; playStep(); } }
function togglePause() {
  PL.paused = !PL.paused;
  $("plPause").textContent = PL.paused ? "▶ Продолжить" : "⏸ Пауза";
  if (PL.paused) { try { speechSynthesis.cancel(); } catch (e) {} }
}
function finishPractice() {
  const p = PL.p, prog = PL.program;
  PL.p = null;
  if (prog) markProgramDayFromPractice(prog);
  openJournalForm(p.id, prog, true);
}

/* ============================================================
   ДНЕВНИК ПРАКТИК
   ============================================================ */
function scaleHtml(name) {
  return `<div class="scale-row" data-scale="${name}">${Array.from({ length: 10 }, (_, i) =>
    `<button type="button" class="scale-btn" onclick="pickScale(this)">${i + 1}</button>`).join("")}</div>`;
}
function pickScale(btn) {
  btn.parentElement.querySelectorAll(".scale-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}
function scaleValue(name) {
  const a = document.querySelector(`.scale-row[data-scale="${name}"] .scale-btn.active`);
  return a ? Number(a.textContent) : null;
}
function openJournalForm(practiceId, program, finished) {
  const p = PRACTICE[practiceId];
  showWelcome(false);
  if (!can("journal")) {
    content().innerHTML = `<div class="practice-box" style="text-align:center;">
      <h3>${finished ? "Практика завершена 🙏" : esc(p.title)}</h3>
      <p>${esc(p.after || "Побудьте немного в тишине, выпейте воды.")}</p>
      <p style="color:#b8ad98;">Дневник практик откроется после выдачи доступа к нему.</p>
      <button class="gold-btn" onclick="${program ? `openProgram('${program}')` : `showSection('${p.dir}')`}">Вернуться</button></div>`;
    return;
  }
  content().innerHTML = `
    <div class="practice-box" style="max-width:640px;">
      <h3>${finished ? "Практика завершена 🙏" : "Запись в дневник"}</h3>
      <p style="margin-top:0;">${esc(p.title)}</p>
      ${p.after && finished ? `<p style="color:#d9d0bd;">${esc(p.after)}</p>` : ""}
      <label class="material-manager-label">Как вы себя чувствовали до практики? (1 — очень плохо, 10 — прекрасно)</label>${scaleHtml("before")}
      <label class="material-manager-label">Как вы себя чувствуете после?</label>${scaleHtml("after")}
      <label class="material-manager-label">Что заметили: ощущения, мысли, образы</label>
      <textarea class="material-manager-input" id="jNote" placeholder="Например: стало легче в груди, пришла мысль позвонить маме…"></textarea>
      <div class="btn-row">
        <button class="gold-btn" onclick="saveJournal('${p.id}', ${program ? `'${program}'` : "null"})">Сохранить</button>
        <button class="gold-btn ghost" onclick="${program ? `openProgram('${program}')` : `showSection('${p.dir}')`}">Пропустить</button>
      </div>
      <div class="material-manager-status" id="jMsg"></div>
    </div>`;
}
async function saveJournal(practiceId, program) {
  const p = PRACTICE[practiceId], msg = $("jMsg");
  const row = { user_id: ME.user.id, practice_id: p.id, practice_title: p.title,
    state_before: scaleValue("before"), state_after: scaleValue("after"), note: ($("jNote").value || "").trim() || null };
  msg.textContent = "Сохраняю…"; msg.className = "material-manager-status";
  const { error } = await sb.from("energy_journal").insert(row);
  if (error) { msg.textContent = "Не удалось сохранить: " + error.message; msg.className = "material-manager-status error"; return; }
  msg.textContent = "Сохранено в дневник."; msg.className = "material-manager-status ok";
  setTimeout(() => program ? openProgram(program) : showSection("journal"), 700);
}
async function renderJournal() {
  if (!can("journal")) { content().innerHTML = lockedHtml("Дневник практик"); return; }
  content().innerHTML = `<div class="empty-table">Загружаю дневник…</div>`;
  const { data, error } = await sb.from("energy_journal").select("*").eq("user_id", ME.user.id).order("created_at", { ascending: false }).limit(500);
  if (error) { content().innerHTML = `<div class="empty-table">Не удалось загрузить дневник: ${esc(error.message)}</div>`; return; }
  const rows = data || [];
  const withBoth = rows.filter(r => r.state_before && r.state_after);
  const avgGain = withBoth.length ? (withBoth.reduce((a, r) => a + (r.state_after - r.state_before), 0) / withBoth.length) : null;
  const days = new Set(rows.map(r => new Date(r.created_at).toDateString())).size;
  const top = Object.entries(rows.reduce((m, r) => (m[r.practice_title] = (m[r.practice_title] || 0) + 1, m), {}))
    .sort((a, b) => b[1] - a[1])[0];
  content().innerHTML = `
    <div class="dashboard-wrap">
      <div class="dashboard-head"><div><h2>Дневник практик</h2><p>Здесь сохраняется, что вы делали и как менялось состояние.</p></div></div>
      <div class="stats-grid">
        <div class="stat-card"><span>Записей</span><strong>${rows.length}</strong></div>
        <div class="stat-card"><span>Дней с практикой</span><strong>${days}</strong></div>
        <div class="stat-card"><span>Среднее изменение состояния</span><strong>${avgGain == null ? "—" : (avgGain > 0 ? "+" : "") + avgGain.toFixed(1)}</strong></div>
        <div class="stat-card"><span>Чаще всего</span><strong style="font-size:17px;">${top ? esc(top[0]) : "—"}</strong></div>
      </div>
      <div class="table-card">

async function loadProgress(programId) {

async function openProgram(programId) {
  stopPlayer();

  setActive("programs"); showWelcome(false);
  content().innerHTML = `<div class="empty-table">Загружаю программу…</div>`;

  content().innerHTML = `
    <button class="back-link" onclick="renderPrograms()">← Все программы</button>

    <div class="practice-box" style="margin-top:16px;">${esc(pr.intro)}
      ${next ? `<div class="btn-row" style="margin-top:14px;"><button class="gold-btn" onclick="openPractice('${programDayPractice(pr, next)}','${pr.id}')">▶ День ${next}: ${esc(PRACTICE[programDayPractice(pr, next)].title)}</button></div>`

    <div class="materials-note">Нажмите на день, чтобы открыть практику или отметить его вручную.</div>`;

async function openProgramDay(programId, day) {
  const pr = PROGRAM[programId], pid = programDayPractice(pr, day);

  const o = document.createElement("div");
  o.className = "material-manager-overlay";
  o.innerHTML = `<div class="material-manager" style="width:480px;">

async function toggleProgramDay(programId, day, isDone, btn) {

function endsFromTerm(v) {

async function confirmEmail(id) {

function filterUserSelect() {
  const q = $("userSearch").value.trim().toLowerCase();
  Array.from($("userSelect").options).forEach((o, i) => { if (i) o.hidden = q && !o.textContent.toLowerCase().includes(q); });
}
function pickUser(id) { $("userSelect").value = id; fillScope(); $("userSelect").scrollIntoView({ behavior: "smooth", block: "center" }); }
function fillScope() {
  const id = $("userSelect").value, scope = (window._userScope || {})[id] || {};
  document.querySelectorAll(".sc").forEach(c => {
    const it = c.dataset.flag ? scope[c.dataset.flag] : (scope[c.dataset.dir] || {})[c.dataset.type];
    c.checked = itemActive(it);
  });
  const u = (window._users || {})[id];
  if (u && $("roleSelect")) $("roleSelect").value = u.energy_role || "student";
  if (u && $("teacherSelect")) $("teacherSelect").value = u.teacher_id || "";
}
function collectScope(all) {
  const scope = {};
  DIR_KEYS.forEach(k => scope[k] = {});
  document.querySelectorAll(".sc").forEach(c => {
    const termKey = c.dataset.flag || c.dataset.dir;
    const term = all ? "unlimited" : (document.querySelector(`[data-term="${termKey}"]`) || {}).value || "unlimited";
    const val = (all || c.checked) ? endsFromTerm(term) : { granted: false };
    if (c.dataset.flag) scope[c.dataset.flag] = val; else scope[c.dataset.dir][c.dataset.type] = val;
  });
  return scope;
}
function grantMsg(t, ok) { const m = $("grantMsg"); m.textContent = t; m.className = "material-manager-status " + (ok ? "ok" : "error"); }
async function writeScope(scope) {
  const userId = $("userSelect").value;
  if (!userId) return grantMsg("Сначала выберите пользователя.");
  const items = [];
  Object.values(scope).forEach(v => { if (v && typeof v.granted === "boolean") items.push(v); else Object.values(v || {}).forEach(x => items.push(x)); });
  const granted = items.filter(x => x && x.granted);
  if (!granted.length) return grantMsg("Отметьте хотя бы один пункт.");
  const unlimited = granted.every(x => x.unlimited);
  const endsAt = unlimited ? null : granted.filter(x => !x.unlimited).map(x => x.ends_at).sort().pop();
  grantMsg("Сохраняю…", true);
  await sb.from("energy_access_periods").update({ status: "expired" }).eq("profile_id", userId).eq("status", "active");
  const { error } = await sb.from("energy_access_periods").insert({
    profile_id: userId, granted_by: ME.user.id, status: "active", starts_at: new Date().toISOString(),
    ends_at: endsAt, is_unlimited: unlimited, granted_scope: scope });
  if (error) return grantMsg("Не удалось выдать доступ: " + error.message);
  grantMsg("Доступ выдан.", true);
  const keep = userId; await loadUsers(); $("userSelect").value = keep; fillScope();
  grantMsg("Доступ выдан.", true);
}
function grantAccess() { return writeScope(collectScope(false)); }
async function grantAll() {
  if (!$("userSelect").value) return grantMsg("Сначала выберите пользователя.");
  if (!await confirmBox("Открыть выбранному пользователю все разделы бессрочно?")) return;
  return writeScope(collectScope(true));
}
async function revokeAccess() {
  const userId = $("userSelect").value;
  if (!userId) return grantMsg("Сначала выберите пользователя.");
  if (!await confirmBox("Закрыть пользователю весь доступ к энергоплатформе?")) return;
  const { error } = await sb.from("energy_access_periods").update({ status: "expired" }).eq("profile_id", userId).eq("status", "active");
  if (error) return grantMsg("Ошибка: " + error.message);
  await loadUsers(); $("userSelect").value = userId; fillScope();
  grantMsg("Доступ закрыт.", true);
}
function roleMsg(t, ok) { const m = $("roleMsg"); m.textContent = t; m.className = "material-manager-status " + (ok ? "ok" : "error"); }
async function setRole() {
  const id = $("userSelect").value;
  if (!id) return roleMsg("Сначала выберите пользователя вверху.");
  const role = $("roleSelect").value;
  const { error } = await sb.from("energy_members").upsert({ profile_id: id, energy_role: role, updated_at: new Date().toISOString() }, { onConflict: "profile_id" });
  if (error) return roleMsg("Ошибка: " + error.message);
  await loadUsers(); $("userSelect").value = id; fillScope();
  roleMsg(role === "practitioner" ? "Назначен практиком. Код практика: " + myCode(id) : "Назначен учеником.", true);
}
async function setTeacher() {
  const id = $("userSelect").value;
  if (!id) return roleMsg("Сначала выберите пользователя вверху.");
  const teacher = $("teacherSelect").value || null;
  if (teacher === id) return roleMsg("Нельзя прикрепить человека к самому себе.");
  const { error } = await sb.from("energy_members").upsert({ profile_id: id, teacher_id: teacher, updated_at: new Date().toISOString() }, { onConflict: "profile_id" });
  if (error) return roleMsg("Ошибка: " + error.message);
  await loadUsers(); $("userSelect").value = id; fillScope();
  roleMsg(teacher ? "Ученик прикреплён к практику." : "Практик откреплён.", true);
}

/* ============================================================
   ВХОД / РЕГИСТРАЦИЯ
   ============================================================ */
function authShell(inner, wide) {
  document.body.style.visibility = "visible";
  document.body.innerHTML = `<div class="auth-shell"><div class="auth-card ${wide ? "auth-card-register" : ""}">
    <div class="auth-symbol">☀</div><div class="auth-title">ENERGY</div><div class="auth-subtitle">Platform</div>${inner}</div></div>`;
}
function showLanding() {
  document.body.style.visibility = "visible";
  document.body.innerHTML = `<div class="landing"><div class="landing-card">
    <div class="logo-symbol">☀</div>
    <h1>Телесные и энергетические практики</h1>
    <p>Очищение, восстановление и наполнение энергией, медитации, работа с подсознанием и квантовые техники — пошагово, с таймером и ведением, в удобное время.</p>
    <div class="landing-dirs">${DIRS.map(d => `<span>${d.icon} ${esc(DIR_NAME[d.key])}</span>`).join("")}<span>✎ Дневник практик</span></div>
    <div class="landing-btns"><button class="gold-btn" onclick="showLogin()">Войти</button><button class="gold-btn ghost" onclick="showRegister()">Зарегистрироваться</button></div>
    <p style="font-size:14px;color:#b8ad98;margin-top:22px;">Если вы уже зарегистрированы на Numerology Platform, войдите с тем же email и паролем.</p>
  </div></div>`;
}
function showLogin(message) {
  authShell(`<h2>Вход в платформу</h2>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Пароль" onkeydown="if(event.key==='Enter')loginUser()">
    <button type="button" onclick="loginUser()">Войти</button>
    <button class="auth-link" type="button" onclick="showForgot()">Забыли пароль?</button>
    <div class="auth-divider">или</div>
    <button class="auth-register" type="button" onclick="showRegister()">Зарегистрироваться</button>
    <div id="loginError" class="auth-message error">${esc(message || "")}</div>
    <button class="auth-link" type="button" onclick="showLanding()">← На главную</button>`);
}
async function loginUser() {
  const email = ($("loginEmail").value || "").trim().toLowerCase(), password = $("loginPassword").value || "", err = $("loginError");
  if (!email || !password) { err.textContent = "Введите email и пароль."; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    err.textContent = /confirm/i.test(error.message || "")
      ? "Почта ещё не подтверждена. Откройте письмо со ссылкой подтверждения (проверьте папку «Спам»). Если письма нет — напишите администратору."
      : "Неверный email или пароль.";
    return;
  }
  touch(); location.reload();
}
function formatPhone(el) { const d = el.value.replace(/\D/g, "").slice(0, 15); el.value = d ? "+" + d : ""; }
function showRegister(message) {
  authShell(`<h2>Регистрация</h2>
    <p class="auth-description">Создайте аккаунт. После регистрации доступ к разделам открывает администратор или ваш практик.</p>
    <p class="auth-description" style="color:#f6d66c;font-size:14px;">⚠️ Если вы уже зарегистрированы на Numerology Platform — не регистрируйтесь заново, просто войдите с тем же email и паролем.</p>
    <div class="auth-grid">
      <input id="rLast" type="text" placeholder="Фамилия *"><input id="rFirst" type="text" placeholder="Имя *">
      <input id="rMiddle" type="text" placeholder="Отчество"><input id="rPhone" type="tel" placeholder="Телефон * (+77001234567)" maxlength="16" oninput="formatPhone(this)">
      <input id="rEmail" type="email" placeholder="Email *"><input id="rCode" type="text" placeholder="Код практика (если есть)" maxlength="8">
      <input id="rPass" type="password" placeholder="Пароль *"><input id="rPass2" type="password" placeholder="Повторите пароль *">
    </div>
    <button type="button" onclick="registerUser()">Создать аккаунт</button>
    <div id="rMsg" class="auth-message ${message ? "error" : ""}">${esc(message || "")}</div>
    <button class="auth-link" type="button" onclick="showLogin()">← Вернуться ко входу</button>`, true);
}
async function registerUser() {
  const v = id => ($(id).value || "").trim();
  const last = v("rLast"), first = v("rFirst"), middle = v("rMiddle"), phone = v("rPhone"), email = v("rEmail").toLowerCase(), code = v("rCode").toUpperCase();
  const p1 = $("rPass").value || "", p2 = $("rPass2").value || "", msg = $("rMsg");
  const set = (t, ok) => { msg.textContent = t; msg.className = "auth-message " + (ok ? "success" : "error"); };
  const nameRe = /^[A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі' -]{2,}$/;
  if (!last || !first || !phone || !email || !p1) return set("Заполните обязательные поля: фамилия, имя, телефон, email и пароль.");
  if (!nameRe.test(last) || !nameRe.test(first) || (middle && !nameRe.test(middle))) return set("Проверьте ФИО — только буквы, не менее 2 символов.");
  if (!/^\+\d{8,15}$/.test(phone)) return set("Проверьте телефон: + код страны и номер, например +77001234567.");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return set("Проверьте email.");
  if (p1.length < 6) return set("Пароль — минимум 6 символов.");
  if (p1 !== p2) return set("Пароли не совпадают.");
  if (code && !/^[0-9A-F]{8}$/.test(code)) return set("Код практика — 8 символов (цифры и буквы A–F).");
  set("Создаю аккаунт…", true);
  const { data, error } = await sb.auth.signUp({ email, password: p1, options: {
    data: { first_name: first, last_name: last, middle_name: middle, phone, role: "student", status: "pending", source: "energy" },
    emailRedirectTo: location.origin + location.pathname } });
  if (error) {
    if (/already|registered|exists/i.test(error.message)) return set("Этот email уже зарегистрирован (возможно, на Numerology Platform). Войдите с тем же паролем.");
    return set(error.message || "Не удалось зарегистрироваться.");
  }
  if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0)
    return set("Этот email уже зарегистрирован (возможно, на Numerology Platform). Войдите с тем же паролем.");
  if (code) localStorage.setItem("energy_pending_code", code);
  if (data && data.session) {
    await ensureMember();
    set("Регистрация завершена. Сейчас откроется платформа.", true);
    setTimeout(() => location.reload(), 900);
  } else {
    set("Аккаунт создан. На вашу почту отправлено письмо со ссылкой подтверждения — откройте его (проверьте и «Спам»), затем войдите со своим email и паролем. Доступ к разделам откроет администратор.", true);
  }
}
function showForgot() {
  authShell(`<h2>Восстановление пароля</h2>
    <input id="fEmail" type="email" placeholder="Ваш email">
    <button type="button" onclick="sendReset()">Отправить ссылку</button>
    <div id="fMsg" class="auth-message"></div>
    <button class="auth-link" type="button" onclick="showLogin()">← Вернуться ко входу</button>`);
}
async function sendReset() {
  const email = ($("fEmail").value || "").trim().toLowerCase(), m = $("fMsg");
  if (!email) { m.textContent = "Введите email."; m.className = "auth-message error"; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  m.textContent = error ? (error.message || "Не удалось отправить письмо.") : "Ссылка для восстановления отправлена на почту.";
  m.className = "auth-message " + (error ? "error" : "success");
}
function showNewPassword() {
  authShell(`<h2>Новый пароль</h2>
    <input id="np1" type="password" placeholder="Новый пароль"><input id="np2" type="password" placeholder="Повторите пароль">
    <button type="button" onclick="saveNewPassword()">Сохранить пароль</button><div id="npMsg" class="auth-message error"></div>`);
}
async function saveNewPassword() {
  const a = $("np1").value, b = $("np2").value, m = $("npMsg");
  if (a.length < 6) { m.textContent = "Минимум 6 символов."; return; }
  if (a !== b) { m.textContent = "Пароли не совпадают."; return; }
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) { m.textContent = "Ошибка: " + error.message; return; }
  m.className = "auth-message success"; m.textContent = "Пароль изменён.";
  history.replaceState(null, "", location.pathname);
  setTimeout(() => location.reload(), 900);
}

/* ---------- выход по бездействию (1 час) ---------- */
const IDLE_LIMIT = 60 * 60 * 1000, IDLE_KEY = "energy_last_activity";
let idleTimer = null;
function touch() { localStorage.setItem(IDLE_KEY, String(Date.now())); clearTimeout(idleTimer); idleTimer = setTimeout(checkIdle, IDLE_LIMIT); }
async function checkIdle() {
  const last = Number(localStorage.getItem(IDLE_KEY) || 0);
  if (last && Date.now() - last >= IDLE_LIMIT && !PL.timer) { await logoutUser(); return; }
  clearTimeout(idleTimer); idleTimer = setTimeout(checkIdle, Math.max(60000, IDLE_LIMIT - (Date.now() - last)));
}
["click", "keydown", "touchstart", "scroll"].forEach(e => document.addEventListener(e, () => { if (ME.user) touch(); }, { passive: true }));
async function logoutUser() {
  stopPlayer();
  try { await sb.auth.signOut(); } catch (e) {}
  localStorage.removeItem(IDLE_KEY);
  ME.user = null;
  showLogin();
}

/* ============================================================
   ЗАГРУЗКА ПОЛЬЗОВАТЕЛЯ
   ============================================================ */
async function ensureMember() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user || ADMIN_EMAILS.includes(String(user.email || "").toLowerCase())) return;
  const { data: m } = await sb.from("energy_members").select("profile_id").eq("profile_id", user.id).maybeSingle();
  if (!m) await sb.from("energy_members").insert({ profile_id: user.id, energy_role: "student" });
  const code = localStorage.getItem("energy_pending_code");
  if (code) { await sb.rpc("energy_join_teacher", { p_code: code }); localStorage.removeItem("energy_pending_code"); }
}
async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;
  ME.user = session.user;
  const email = String(ME.user.email || "").toLowerCase();
  const [{ data: profile }, { data: member }, { data: periods }] = await Promise.all([
    sb.from("profiles").select("role, first_name, last_name, email").eq("id", ME.user.id).maybeSingle(),
    sb.from("energy_members").select("*").eq("profile_id", ME.user.id).maybeSingle(),
    sb.from("energy_access_periods").select("*").eq("profile_id", ME.user.id).order("created_at", { ascending: false })
  ]);
  ME.profile = profile;
  ME.member = member;
  ME.isAdmin = ADMIN_EMAILS.includes(email) || (profile && profile.role === "admin");
  ME.isPractitioner = !!(member && member.energy_role === "practitioner");
  const active = (periods || []).filter(periodActive);
  ME.period = active[0] || null;
  ME.grant = ME.period ? (ME.period.granted_scope || {}) : {};
  return true;
}
async function boot() {
  try {
    if (location.hash.includes("type=recovery")) { showNewPassword(); return; }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showLanding(); return; }
    await ensureMember();
    await loadMe();
    const p = ME.profile || {};
    $("clientName").textContent = p.first_name || (ME.isAdmin ? "Администратор" : String(ME.user.email).split("@")[0]);
    $("clientEmail").textContent = p.email || ME.user.email || "";
    document.body.style.visibility = "visible";
    touch();
    showSection("home");
  } catch (e) {
    console.error(e);
    showLogin("Не удалось подключиться к платформе. Проверьте интернет и попробуйте ещё раз.");
  }
}
document.addEventListener("DOMContentLoaded", boot);

</script>
